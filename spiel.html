html,body{margin:0;height:100%;background:#0b1424;color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow:hidden}
#map{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.top{position:fixed;left:0;right:0;top:0;padding:10px 12px 0;display:flex;flex-direction:column;gap:8px;pointer-events:none;z-index:2}
.brand{display:flex;align-items:center;gap:8px;pointer-events:auto}
.brand b{font:700 21px "Playfair Display",serif;color:var(--gold);text-shadow:0 2px 8px #000}
.brand small{color:var(--mute);font-size:13px;white-space:nowrap;text-shadow:0 1px 4px #000}
.brand .sp{flex:1}
.lenses{display:flex;gap:6px;overflow-x:auto;pointer-events:auto;scrollbar-width:none;padding-bottom:4px}
.lenses::-webkit-scrollbar{display:none}
button{font:600 14px Inter,sans-serif;color:var(--ink);background:rgba(19,33,58,.9);border:1px solid var(--line);border-radius:22px;padding:0 14px;height:40px;cursor:pointer;flex:none}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button[aria-pressed=true]{background:var(--gold);color:#1a1405;border-color:var(--gold)}
#quest{pointer-events:auto;display:none;background:rgba(14,26,46,.94);border:1px solid var(--line);border-radius:12px;padding:10px 12px;align-items:center;gap:10px;flex-wrap:wrap}
#quest.on{display:flex}
#quest p{margin:0;flex:1 1 220px}#quest p b{color:var(--gold)}
#quest .sc{font:700 15px "Playfair Display",serif;color:var(--gold)}
#legend{position:fixed;left:12px;bottom:12px;background:rgba(14,26,46,.92);border:1px solid var(--line);border-radius:10px;padding:8px 12px;width:min(260px,60vw);display:none;z-index:1}
#legend.on{display:block}
#legend b{font:700 14px "Playfair Display",serif;color:var(--gold)}
#legend .bar{height:10px;border-radius:5px;margin:6px 0 2px}
#legend .mm{display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
#legend .u{font-size:13px;color:var(--mute)}
#panel{position:fixed;left:8px;right:8px;bottom:8px;max-height:56vh;overflow:auto;background:linear-gradient(#182945,#0f1b31);border:1px solid var(--line);border-radius:14px;padding:16px 18px 18px;box-shadow:0 10px 40px rgba(0,0,0,.6);transform:translateY(115%);transition:transform .25s ease;z-index:3}
#panel.open{transform:none}
@media(max-width:420px){.brand small{display:none}}
@media(min-width:760px){#panel{left:auto;right:16px;top:118px;bottom:auto;width:390px;max-height:calc(100vh - 136px);transform:translateX(120%)}#panel.open{transform:none}}
@media(prefers-reduced-motion:reduce){#panel{transition:none}}
#panel .x{position:sticky;top:0;float:right;height:36px;width:36px;padding:0;border-radius:50%}
.ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-right:40px}
h2{font:700 26px/1.1 "Playfair Display",serif;color:var(--gold);margin:0}
h3{font:700 13px "Playfair Display",serif;color:var(--gold);margin:16px 0 6px;letter-spacing:.06em}
.tag{background:var(--c);color:#fff;border-radius:12px;padding:2px 10px;font:700 13px Inter;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.sub{color:var(--mute);margin:4px 0 0;font-size:14px}.sub b{color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.stats b{display:block;font:700 clamp(19px,5vw,24px) "Playfair Display",serif;white-space:nowrap}.stats span{font-size:13px;color:var(--mute)}
.row{display:flex;justify-content:space-between;margin:0;gap:8px}.row b{font-family:"Playfair Display",serif;color:var(--ink)}
.people{display:flex;gap:2px;margin-top:6px}.people svg{width:14px;height:22px;fill:#46546f}.people svg.on{fill:var(--c)}
.cmp{margin:8px 0}.cmp .l{display:flex;justify-content:space-between;font-size:14px}.cmp .l span{color:var(--mute)}
.cmp .t{height:8px;background:rgba(255,255,255,.08);border-radius:4px;margin-top:3px;overflow:hidden}.cmp .t i{display:block;height:100%;border-radius:4px}
.dist{display:flex;gap:10px;margin:8px 0;align-items:flex-start}
.dist i{flex:none;width:30px;height:30px;border-radius:50%;background:var(--c);border:2px solid var(--gold);display:grid;place-items:center;font:700 14px "Playfair Display",serif;font-style:normal;color:#fff}
.dist b{display:block}.dist span{font-size:14px;color:var(--mute)}
.kv{width:100%;border-collapse:collapse;font-size:15px}.kv td{padding:7px 0;border-bottom:1px solid rgba(226,194,122,.14);vertical-align:top}
.kv td:nth-child(2){text-align:right;font-weight:700;white-space:nowrap;padding:7px 10px}.kv td:nth-child(3){width:86px}
.kv small{display:block;font-size:13px;color:var(--mute);font-weight:400}
.rk{display:block;height:6px;margin-top:7px;border-radius:3px;background:linear-gradient(90deg,var(--gold) var(--p),rgba(255,255,255,.1) var(--p))}
.vb{display:block;height:8px;margin-top:7px;border-radius:4px;background:linear-gradient(90deg,var(--c) var(--w),rgba(255,255,255,.08) var(--w))}
.seats{display:flex;flex-wrap:wrap;gap:3px;margin:12px 0 4px}.seats i{width:11px;height:11px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.src{font-size:13px;color:var(--mute);margin-top:14px;border-top:1px solid var(--line);padding-top:8px}
.src a{color:var(--gold)}
#intro{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:radial-gradient(ellipse at center,rgba(8,14,26,.55),rgba(8,14,26,.92));padding:24px;text-align:center}
#intro.off{display:none}
#intro{overflow-y:auto;place-items:safe center}
.guide{max-width:440px;margin:0 auto 18px;text-align:left;background:rgba(11,20,36,.75);border:1px solid rgba(226,194,122,.35);border-radius:14px;padding:12px 16px 10px}
.guide h4{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#e2c27a;margin:0 0 6px}
.guide ol{margin:0;padding-left:20px}.guide li{font-size:14px;line-height:1.4;color:#e6e9f0;margin:5px 0;font-weight:400}.guide li b{color:#f6e3ae}

.free{display:inline-block;background:#2fae7a;color:#fff;font:700 16px Inter,sans-serif;border-radius:20px;padding:6px 16px;margin:0 0 18px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
#intro h1{font:700 clamp(40px,11vw,76px)/1.02 "Playfair Display",serif;margin:0;background:linear-gradient(#f6e3ae,#b88a3a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 8px #000)}
#intro em{display:block;font:italic 19px Inter;color:#e8dcc0;margin:10px 0 14px}
#intro p{font-weight:600;color:#e6e9f0;margin:0 0 22px}
#intro .bt{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#intro .bt button{height:48px;padding:0 22px;font-size:16px}
#intro .bt .pri{background:var(--gold);color:#1a1405}

#pName{flex:1;height:36px;border-radius:18px;border:1px solid var(--line);background:#0e1a30;color:var(--ink);font:600 15px Inter,sans-serif;padding:0 12px;min-width:0}
.back{color:var(--gold);text-decoration:none;font:600 18px Inter,sans-serif;text-shadow:0 1px 4px #000}
#lang{height:40px;border-radius:22px;background:rgba(19,33,58,.9);color:var(--ink);border:1px solid var(--line);font:600 14px Inter,sans-serif;padding:0 8px;max-width:104px}

 const vals=Object.entries(BZ).map(([c,b])=>[c,b.d[q[1]]]).sort((a,b)=>sgn*(b[1]-a[1])),right=vals[0][0]===code;if(right)quiz.sc+=100;showBz(code);
 finish('<b>'+esc(right?T('right'):T('wrong'))+'</b> '+esc(tf(T('sought'),{x:BZ[vals[0][0]].name,v:F(vals[0][1])}))+(right?'':' – '+esc(tf(T('pick'),{x:BZ[code].name,v:F(BZ[code].d[q[1]])})))+'.',null)}
$('qNext').onclick=()=>{if(quiz.i<QS.length-1){quiz.i++;setLens('bezirk');panel.classList.remove('open');ask()}else{const m=QS.length*100,rk=T('ranks')[Math.min(4,Math.floor(quiz.sc/m*5))];let best=0;try{best=Math.max(+localStorage.getItem('nordspiel_best_'+CFG.key)||0,quiz.sc);localStorage.setItem('nordspiel_best_'+CFG.key,best)}catch(e){}
 saveRun(quiz.sc);$('qText').innerHTML=esc(tf(T('result'),{s:quiz.sc,m,rk}))+(best?' '+esc(tf(T('best'),{b:best})):'')+' <button class="lb" onclick="showBoard()">🏆 '+esc(BT('board'))+'</button>';$('qNext').style.display='none';quiz.done=true;quiz.end=true;showBoard()}};
$('qEnd').onclick=()=>{quiz=null;$('quest').classList.remove('on');setLens('terrain')};
$('bQuiz').onclick=startQuiz;$('iQuiz').onclick=startQuiz;$('iGo').onclick=()=>$('intro').classList.add('off');$('iBoard').onclick=()=>{$('intro').classList.add('off');showBoard()};$('iHelp').onclick=()=>{$('intro').classList.add('off');showHelp()};
// ---------- Bestenliste (Computer-Gegner + eigene Runden auf diesem Gerät) ----------
const BT=k=>CFG.board[LG][k];
const pname=()=>{try{return localStorage.getItem('nordspiel_name')||''}catch(e){return''}};
function runs(){try{return JSON.parse(localStorage.getItem('nordspiel_runs_'+CFG.key)||'[]')}catch(e){return[]}}
function saveRun(sc){const r=runs();r.push({n:pname(),s:sc});r.sort((a,b)=>b.s-a.s);try{localStorage.setItem('nordspiel_runs_'+CFG.key,JSON.stringify(r.slice(0,5)))}catch(e){}}
window.showBoard=function(){const m=QS.length*100,rk=T('ranks'),me=pname()||BT('you');
 const L=CFG.rivals.map(([n,f])=>({n,s:Math.round(f*m/50)*50,cpu:1})).concat(runs().map(r=>({n:me,s:r.s,me:1}))).sort((a,b)=>b.s-a.s||(a.cpu?1:-1)).slice(0,10);
 pBody.innerHTML=`<div class="ph"><h2>🏆 ${esc(BT('board'))}</h2></div><p class="sub">${esc(BT('note'))}</p>
 <table class="kv board">${L.map((e,i)=>`<tr class="${e.me?'me':''}"><td><b>${i+1}.</b> ${esc(e.n)}${e.cpu?` <span class="cpu">${esc(BT('cpu'))}</span>`:''}<small>${esc(rk[Math.min(4,Math.floor(e.s/m*5))])}</small></td><td>${e.s} ${esc(T('gold'))}</td></tr>`).join('')}</table>
 <p class="row" style="margin-top:14px"><input id="pName" maxlength="20" placeholder="${esc(BT('name'))}" value="${esc(pname())}"><button id="pSave" class="lb">${esc(BT('save'))}</button></p>
 ${runs().length?'':`<p class="sub">${esc(BT('empty'))}</p>`}${legal()}`;
 panel.classList.add('open');panel.scrollTop=0;
 $('pSave').onclick=()=>{try{localStorage.setItem('nordspiel_name',$('pName').value.trim().slice(0,20))}catch(e){}showBoard()}};
// ---------- Sprache ----------
function applyLang(){document.documentElement.lang=LG;mkLens();mkQS();lensBar();
 $('bTitle').textContent=cname();$('bSmall').textContent=T('title_sfx')+' · '+T('free');$('bQuiz').textContent=T('quiz_btn');$('bSrc').textContent=T('src_btn');
 $('qNext').textContent=T('next');$('qEnd').textContent=T('end');
 $('iH1').textContent=cname();$('iEm').textContent=T('title_sfx')+' – '+T('sub');
 $('iP').textContent=`${ST.length} ${UP()} · ${Object.keys(BZ).length} ${GP()} · ${nTour} ${T('sights')} · ${T('every')}`;
 $('iFree').textContent=T('free_line');$('iGuide').innerHTML='<h4>'+esc(T('help_t'))+'</h4><ol>'+T('help').map(h=>'<li><b>'+esc(h[0].charAt(0)+h[0].slice(1).toLowerCase())+'</b> – '+esc(h[1])+'</li>').join('')+'</ol>';$('iGo').textContent=T('explore');$('iQuiz').textContent=T('play');$('iHelp').textContent=T('how');$('iBoard').textContent='🏆 '+BT('board');$('iLegal').innerHTML=legal();
 document.title=cname()+' '+T('title_sfx')+' – '+CFG.marke;
 if(quiz&&!quiz.end){quiz.done?0:ask()}panel.classList.remove('open');setLens(lens);draw()}
$('lang').innerHTML=CFG.langs.map(l=>`<option value="${l}">${esc(I18N[l].lang_name)}</option>`).join('');$('lang').value=LG;
$('lang').addEventListener('change',e=>{LG=e.target.value;try{localStorage.setItem('nordspiel_lang',LG)}catch(x){}applyLang()});
// ---------- Gesten ----------
const pts=new Map();let moved=0;
function zoomAt(px,py,f){const[kx,ky]=toK(px,py);view.s=Math.max(2/R,Math.min(48/R,view.s*f));view.cx=kx-(px-W/2)/view.s;view.cy=ky-(py-H/2)/view.s;draw()}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);if(pts.size===1)moved=0});
cv.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const p=pts.get(e.pointerId);
 if(pts.size===1){const dx=e.clientX-p[0],dy=e.clientY-p[1];view.cx-=dx/view.s;view.cy-=dy/view.s;moved+=Math.abs(dx)+Math.abs(dy);draw()}
 else if(pts.size===2){const o=[...pts.entries()].find(([k])=>k!==e.pointerId)[1];const d0=Math.hypot(p[0]-o[0],p[1]-o[1]),d1=Math.hypot(e.clientX-o[0],e.clientY-o[1]);
  const m0=[(p[0]+o[0])/2,(p[1]+o[1])/2],m1=[(e.clientX+o[0])/2,(e.clientY+o[1])/2];view.cx-=(m1[0]-m0[0])/view.s;view.cy-=(m1[1]-m0[1])/view.s;if(d0>0)zoomAt(m1[0],m1[1],d1/d0);moved+=99}
 pts.set(e.pointerId,[e.clientX,e.clientY])});
const up=e=>{if(pts.size===1&&moved<8)tap(e.clientX,e.clientY);pts.delete(e.pointerId)};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',e=>pts.delete(e.pointerId));
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*.0015))},{passive:false});
function tap(x,y){if((!quiz||quiz.done)&&lens==='tour'){for(const t of ST){if(!TOUR[t.n])continue;const[a,b]=toS(t.x,t.y);if(Math.hypot(a-x,b-y)<18){const hex=hexAt(t.x,t.y);sel={hex};showBz(t.b,hex&&hex.st===t?hex:{st:t,k:t.k});draw();return}}}
 if(!quiz||quiz.done){if(view.s>=12)for(const l of LM){const[a,b]=toS(l.x,l.y);if(Math.hypot(a-x,b-y)<16){sel=null;showLm(l);draw();return}}}
 for(const c in BZ){const h=BZ[c].hit;if(h&&x>=h[0]&&x<=h[0]+h[2]&&y>=h[1]&&y<=h[1]+h[3]){sel=null;quiz&&!quiz.done?answer(c):showBz(c);draw();return}}
 const[kx,ky]=toK(x,y),hex=hexAt(kx,ky);if(!hex||!hex.inside){panel.classList.remove('open');sel=null;draw();return}
 sel={hex};if(quiz&&!quiz.done)answer(hex.bz,hex);else showBz(hex.bz,hex);draw()}
addEventListener('keydown',e=>{const k={ArrowLeft:[-2,0],ArrowRight:[2,0],ArrowUp:[0,-2],ArrowDown:[0,2]}[e.key];if(k){view.cx+=k[0]*R*2;view.cy+=k[1]*R*2;draw()}if(e.key==='+')zoomAt(W/2,H/2,1.25);if(e.key==='-')zoomAt(W/2,H/2,.8);if(e.key==='Escape')$('pClose').onclick()});
addEventListener('resize',resize);
resize();fit();applyLang();
const go=()=>{base=renderBase();for(const k in lensCache)delete lensCache[k];draw()};
go();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(go);
}

</script></body></html>
